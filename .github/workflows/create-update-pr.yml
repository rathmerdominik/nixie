name: "Update Nix system"
on:
  workflow_dispatch:
  schedule:
    - cron: 0 18 */1 * *

env:
  TUBES_JSON: '["krypton", "helium"]'

jobs:
  capture-package-lists:
    name: Capture package list for ${{ matrix.tube }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tube:
          - krypton
          - helium

    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Nix environment
        shell: bash
        run: |
          set -euo pipefail

          if [ -f /etc/profile.d/nix.sh ]; then
            source /etc/profile.d/nix.sh
          elif [ -f "$HOME/.nix-profile/etc/profile.d/nix.sh" ]; then
            source "$HOME/.nix-profile/etc/profile.d/nix.sh"
          fi

          echo "$HOME/.nix-profile/bin:/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"

      - name: Generate package list for ${{ matrix.tube }}
        shell: bash
        run: |
          set -euo pipefail

          nix eval --raw ".#nixosConfigurations.${{ matrix.tube }}.config.environment.systemPackages" \
            --apply 'pkgs:
              let
                names = map (p: if p ? pname then p.pname else p.name) pkgs;
                versions = map (p: if p ? version then p.version else (builtins.parseDrvName p.name).version) pkgs;
                pairs = builtins.genList (i: let
                  name = builtins.elemAt names i;
                  version = builtins.elemAt versions i;
                in "${name}/${version}") (builtins.length names);
                sorted = builtins.sort (x: y: x < y) pairs;
              in builtins.concatStringsSep "\n" sorted' > "${{ matrix.tube }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: package-list-${{ matrix.tube }}
          path: ${{ matrix.tube }}.txt
          if-no-files-found: error

  update-flake:
    name: Update flake and open PR
    needs: capture-package-lists
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Nix environment
        shell: bash
        run: |
          set -euo pipefail

          if [ -f /etc/profile.d/nix.sh ]; then
            source /etc/profile.d/nix.sh
          elif [ -f "$HOME/.nix-profile/etc/profile.d/nix.sh" ]; then
            source "$HOME/.nix-profile/etc/profile.d/nix.sh"
          fi

          echo "$HOME/.nix-profile/bin:/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"

      - name: Download package snapshots
        uses: actions/download-artifact@v5
        with:
          path: ./package-snapshots

      - name: Create before snapshots
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p before after

          while IFS= read -r snapshot; do
            tube=$(basename "$snapshot" .txt)
            cp "$snapshot" "before/$tube.before"
          done < <(find package-snapshots -type f -name '*.txt' | sort)

      - name: Update flake inputs
        shell: bash
        run: |
          set -euo pipefail
          nix flake update

      - name: Create after snapshots
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r snapshot; do
            tube=$(basename "$snapshot" .before)
            nix eval --raw ".#nixosConfigurations.${tube}.config.environment.systemPackages" \
              --apply 'pkgs:
                let
                  names = map (p: if p ? pname then p.pname else p.name) pkgs;
                  versions = map (p: if p ? version then p.version else (builtins.parseDrvName p.name).version) pkgs;
                  pairs = builtins.genList (i: let
                    name = builtins.elemAt names i;
                    version = builtins.elemAt versions i;
                  in "${name}/${version}") (builtins.length names);
                  sorted = builtins.sort (x: y: x < y) pairs;
                in builtins.concatStringsSep "\n" sorted' > "after/$tube.after"
          done < <(find before -type f -name '*.before' | sort)

      - name: Compare package snapshots
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          sections=()
          packages_changed=false

          while IFS= read -r before_file; do
            tube=$(basename "$before_file" .before)
            after_file="after/$tube.after"

            if [ ! -f "$after_file" ]; then
              echo "Missing snapshot for $tube" >&2
              exit 1
            fi

            if cmp -s "$before_file" "$after_file"; then
              sections+=("### $tube")
              sections+=("- No package changes")
              sections+=("")
            else
              packages_changed=true
              sections+=("### $tube")
              while IFS= read -r line; do
                case "$line" in
                  ---*|+++*|@@*) continue ;;
                  +*) sections+=("+${line#\+}") ;;
                  -*) sections+=("${line}") ;;
                esac
              done < <(diff -u "$before_file" "$after_file" || true)
              sections+=("")
            fi
          done < <(find before -type f -name '*.before' | sort)

          if git diff --quiet -- flake.lock; then
            flake_changed=false
          else
            flake_changed=true
          fi

          body=""
          for section in "${sections[@]}"; do
            body+="$section"
            body+=$'\n'
          done

          changed=false
          if [ "$packages_changed" = true ] || [ "$flake_changed" = true ]; then
            changed=true
          fi

          {
            echo "changed=$changed"
            echo "body<<EOF"
            printf '%s\n' "$body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Combined diff:"
          printf '%s\n' "$body"

      - name: Create pull request
        if: steps.compare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          commit-message: "chore: update flake inputs"
          branch: "chore/update-nix-flake"
          branch-suffix: timestamp
          add-paths: |
            flake.lock
          delete-branch: true
          title: "chore: update Nix flake inputs"
          body: ${{ steps.compare.outputs.body }}